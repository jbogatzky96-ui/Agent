# Copy to config.toml and adjust. Every key is optional; missing keys use the defaults shown here.

answer_language = "Deutsch"
my_name = ""              # your name, helps detect questions addressed to you
me_label = "Ich"
them_label = "Gegenüber"
context_dir = "context"   # briefing.md + PDFs/DOCX/MD/TXT for the call
save_transcript = false   # only enable with the other participants' consent
transcript_dir = "transcripts"
protocol_dir = "protokolle"    # after every session: summary + full transcript + cards (Word and Markdown)
protocol_summary = true        # summary written by answer_model
protocol_docx = true

[audio]
capture_mic = true        # transcribe yourself too (better context, doubles Deepgram minutes)
loopback_device = ""      # name fragment from --list-devices; empty = Windows default output
mic_device = ""           # name fragment; empty = Windows default microphone
chunk_ms = 50

[deepgram]
model = "nova-3"
language = "de"
endpointing_ms = 300      # pause that ends a sentence
utterance_end_ms = 1000
keyterms = []             # e.g. ["EBITDA", "Müller GmbH", "SAP S/4HANA"]

[llm]
# Continuous feed: after each new segment the model writes one short card
# (FRAGE = suggested answer, INFO = background) or nothing.
feed_enabled = true
feed_model = "claude-haiku-5-5"   # fast and cheap; "claude-sonnet-5-5" or "claude-opus-5-5" for better content
feed_effort = "low"
feed_max_tokens = 1500
feed_min_words = 6                # collect short segments until this many words (or a "?")
feed_on_my_speech = false         # also create cards after you speak
feed_transcript_chars = 20000
feed_max_words = 150              # length limit of a card
# Second stage: for FRAGE cards the stronger model adds a thorough answer to the same card
deepen_questions = true
deepen_effort = "medium"          # low = faster, high = more thorough
# Stronger model, used for the second stage and for the hotkey (Ctrl+Alt+A)
answer_model = "claude-opus-5-5"
answer_effort = "low"             # hotkey: low = fastest; medium/high = more thorough but slower
answer_max_tokens = 4000
answer_max_words = 220
answer_transcript_chars = 60000
use_refusal_fallback = true

[ui]
opacity = 0.93
font_size = 11
width = 480
height = 600
hotkey_answer = "ctrl+alt+a"
hotkey_toggle = "ctrl+alt+h"
hotkey_start_stop = "ctrl+alt+s"
